<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行为谱系理论关系图</title>
  <style>
    :root {
      --paper: #f8fbff;
      --ink: #151923;
      --muted: #687385;
      --line: rgba(31, 57, 86, 0.12);
      --city: #2c98d4;
      --behavior: #8b78d6;
      --bridge: #ef6b63;
      --active: #2d83d4;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.7);
      --shadow: 0 30px 90px rgba(45, 91, 132, 0.14);
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      --sans: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background-image:
        radial-gradient(rgba(33, 72, 112, 0.08) 0.42px, transparent 0.42px),
        radial-gradient(circle at 10% 12%, rgba(124, 198, 241, 0.38), transparent 24%),
        radial-gradient(circle at 84% 14%, rgba(255, 212, 83, 0.14), transparent 17%),
        radial-gradient(circle at 78% 76%, rgba(239, 107, 99, 0.12), transparent 20%),
        linear-gradient(125deg, #fafdff 0%, #eaf6ff 50%, #f8f4ff 100%);
      background-size: 22px 22px, auto, auto, auto, auto;
      font-family: var(--sans);
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid rgba(31, 57, 86, 0.08);
      background: var(--glass);
      backdrop-filter: blur(20px);
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand { margin-bottom: 22px; }

    .brand h1 {
      font-size: 25px;
      line-height: 1.15;
      margin: 0 0 10px;
      font-family: var(--serif);
    }

    .brand p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      outline: none;
    }

    .search:focus {
      border-color: var(--bridge);
      box-shadow: 0 0 0 3px rgba(49, 95, 138, 0.14);
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--white);
    }

    .segments button {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      padding: 9px 6px;
      color: var(--muted);
      cursor: pointer;
      min-height: 42px;
      font-size: 13px;
    }

    .segments button:last-child { border-right: 0; }

    .segments button.active {
      background: var(--active);
      color: #fafdff;
    }

    .theory-list {
      display: grid;
      gap: 8px;
      padding-bottom: 28px;
    }

    .theory-button {
      text-align: left;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.48);
      border-radius: 8px;
      padding: 11px 12px;
      cursor: pointer;
      color: var(--ink);
      min-height: 58px;
      transition: transform 0.28s ease, box-shadow 0.28s ease, background 0.25s ease, border-color 0.25s ease;
    }

    .theory-button:hover,
    .theory-button.active {
      border-color: rgba(31, 57, 86, 0.08);
      background: rgba(255, 255, 255, 0.86);
      transform: translateX(5px);
      box-shadow: 0 4px 18px rgba(45, 91, 132, 0.08);
    }

    .theory-button strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .theory-button small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .main {
      padding: 42px;
      display: grid;
      gap: 22px;
      grid-template-rows: auto minmax(540px, 66vh) auto;
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    .topline h2 {
      margin: 0;
      font-size: 38px;
      line-height: 1.15;
      font-family: var(--serif);
    }

    .topline p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 820px;
      line-height: 1.8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 96px);
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.76);
      border-radius: 8px;
      padding: 10px;
      min-height: 70px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.75fr);
      gap: 18px;
      min-height: 0;
    }

    .graph-panel,
    .detail-panel,
    .relation-panel {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(18px);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .graph-panel {
      position: relative;
      overflow: hidden;
      min-height: 540px;
      background:
        radial-gradient(circle at 28% 26%, rgba(124, 198, 241, 0.18), transparent 24%),
        radial-gradient(circle at 72% 62%, rgba(139, 120, 214, 0.12), transparent 25%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(234, 247, 255, 0.68));
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    .edge {
      opacity: 0.48;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.5s ease, stroke-width 0.5s ease, stroke 0.5s ease, filter 0.5s ease;
    }

    .edge-shadow {
      opacity: 0.04;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: blur(0.5px);
      transition: opacity 0.5s ease;
    }

    .edge.active {
      opacity: 1;
      filter: drop-shadow(0 0 9px rgba(45, 91, 132, 0.12));
    }

    .edge-shadow.active { opacity: 0.08; }

    .edge.dim { opacity: 0.08; }
    .edge-shadow.dim { opacity: 0.02; }

    .node {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0.35s ease, filter 0.35s ease;
    }

    .node circle {
      cursor: pointer;
      transition: stroke-width 0.28s ease, filter 0.28s ease, opacity 0.28s ease;
    }

    .node-glow {
      opacity: 0.055;
      filter: blur(0.8px);
      stroke: none;
      mix-blend-mode: multiply;
    }

    .node-core {
      fill-opacity: 0.62;
      stroke-width: 0.8;
      filter:
        drop-shadow(0 11px 20px rgba(45, 91, 132, 0.11))
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.56));
    }

    .node text {
      pointer-events: none;
      fill: var(--ink);
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node.active .node-core {
      stroke-width: 3.2;
      fill-opacity: 0.46;
      filter: drop-shadow(0 14px 24px rgba(45, 91, 132, 0.14));
    }

    .node.active .node-glow { opacity: 0.07; }
    .node.active text { font-weight: 800; }

    .node.core text {
      font-size: 12px;
      font-weight: 700;
    }

    .node.context text {
      font-size: 11px;
      font-weight: 650;
    }

    .node.supplement text {
      font-size: 10px;
      font-weight: 560;
      fill: rgba(21, 25, 35, 0.82);
    }

    .node.dim {
      opacity: 0.28;
      filter: none;
    }

    .node:not(.dim):not(.active) {
      animation: floatNode 7s ease-in-out infinite;
    }

    .node.core:not(.dim):not(.active) { animation-duration: 8.5s; }

    .cluster-label {
      fill: rgba(31, 57, 86, 0.54);
      font-size: 15px;
      font-weight: 700;
    }

    .cluster-boundary {
      fill: none;
      stroke-width: 1;
      stroke-dasharray: 6 10;
      opacity: 0.20;
      pointer-events: none;
    }

    .graph-legend-card {
      fill: rgba(255, 255, 255, 0.72);
      stroke: rgba(31, 57, 86, 0.1);
      filter: drop-shadow(0 10px 24px rgba(45, 91, 132, 0.08));
    }

    .graph-legend-title {
      fill: rgba(21, 25, 35, 0.74);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .graph-legend-text {
      fill: rgba(31, 57, 86, 0.62);
      font-size: 12px;
      font-weight: 600;
    }

    .timeline-line {
      stroke: rgba(31, 57, 86, 0.18);
      stroke-width: 1;
    }

    .timeline-dot {
      fill: rgba(31, 57, 86, 0.25);
      transition: fill 0.3s ease, r 0.3s ease;
      cursor: pointer;
    }

    .timeline-dot.active { fill: var(--active); }

    .timeline-text {
      fill: rgba(31, 57, 86, 0.42);
      font-size: 11px;
      text-anchor: middle;
    }

    .detail-panel {
      padding: 24px;
      overflow: auto;
    }

    .detail-kicker {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .quote {
      border-left: 3px solid rgba(103, 120, 217, 0.42);
      margin: 0 0 18px;
      padding: 2px 0 2px 14px;
      color: #4d5668;
      font-family: var(--serif);
      font-size: 16px;
      font-style: italic;
      line-height: 1.8;
    }

    .detail-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .detail-title h3 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-family: var(--serif);
    }

    .badge {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #fff;
      background: var(--bridge);
    }

    .badge.city { background: var(--city); }
    .badge.behavior { background: var(--behavior); }
    .badge.bridge { background: var(--bridge); }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
    }

    .section.source-section {
      border-top: 0;
      padding-top: 0;
    }

    .section h4 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .section p,
    .section li {
      color: #2f3542;
      line-height: 1.75;
      font-size: 14px;
    }

    .section ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .relation-panel { padding: 18px; }

    .relation-panel h3 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .relation-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .relation-card {
      border: 1px solid rgba(31, 57, 86, 0.08);
      background: rgba(255, 255, 255, 0.54);
      border-radius: 8px;
      padding: 12px;
      min-height: 92px;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .relation-card:hover {
      background: rgba(255, 255, 255, 0.82);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(45, 91, 132, 0.09);
    }

    .relation-card strong {
      font-size: 14px;
      line-height: 1.4;
      display: block;
      margin-bottom: 6px;
    }

    .relation-card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .workspace { grid-template-columns: 1fr; }
      .graph-panel { min-height: 520px; }
      .topline {
        align-items: start;
        flex-direction: column;
      }
    }

    @media (max-width: 720px) {
      .main { padding: 18px; }
      .topline h2 { font-size: 26px; }
      .stats {
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
      }
      .relation-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>行为研究理论关系</h1>
        <p>面向多层级行为谱系建构的跨学科理论关系图</p>
      </div>

      <div class="controls">
        <input id="search" class="search" type="search" placeholder="检索理论、关键词或研究方法" />
        <div class="segments" role="tablist" aria-label="理论范围">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="city">空间情境</button>
          <button data-filter="bridge">连接机制</button>
          <button data-filter="behavior">行为分类</button>
        </div>
      </div>

      <div id="theoryList" class="theory-list"></div>
    </aside>

    <main class="main">
      <section class="topline">
        <div>
          <h2>行为谱系的理论来源与分类依据</h2>
          <p>本图以城市公共空间中的日常行为为研究对象，整合城市研究、环境行为学、时间地理学、时间使用调查、社会学、健康与行为科学等理论来源。不同理论分别从空间情境、活动功能、时空约束、互动意义、身体能力和行为机制等角度说明行为如何被划分、编码和解释，为“场景—活动—行为—动作”的多层级行为谱系建构提供依据。</p>
        </div>
        <div class="stats">
          <div class="stat"><strong id="totalCount">0</strong><span>理论节点</span></div>
          <div class="stat"><strong id="cityCount">0</strong><span>空间情境</span></div>
          <div class="stat"><strong id="behaviorCount">0</strong><span>行为分类</span></div>
        </div>
      </section>

      <section class="workspace">
        <div class="graph-panel">
          <svg id="graph" viewBox="0 0 1280 900" preserveAspectRatio="xMidYMid meet" aria-label="理论关系网络"></svg>
        </div>
        <article id="detail" class="detail-panel"></article>
      </section>

      <section class="relation-panel">
        <h3>跨域联系</h3>
        <div id="relations" class="relation-grid"></div>
      </section>
    </main>
  </div>

  <script>
    const theories = [
      {
            "id": "athens",
            "title": "雅典宪章与功能城市理论",
            "domain": "city",
            "tradition": "空间功能组织",
            "source": "源于 1933 年 CIAM 第四次会议，后由勒·柯布西耶整理传播，是现代主义城市规划和城市功能分类的经典来源。",
            "content": [
                  "将城市活动归入居住、工作、游憩和交通四类基本功能，强调行为首先受城市功能分区组织。",
                  "其分类依据不是动作本身，而是日常活动所依附的城市功能和空间用途。",
                  "可用于支撑行为谱系的高层级场景划分，如居住相关行为、工作相关行为、休闲游憩行为和交通移动行为。"
            ],
            "frameworkRole": "为行为谱系提供 L1 层的功能场景依据，说明行为分类首先受到居住、工作、游憩、交通等空间功能背景的组织。",
            "extensions": [
                  "土地利用分区理论",
                  "交通-土地利用关系研究",
                  "功能混合研究",
                  "公共服务设施可达性研究"
            ],
            "tags": [
                  "功能",
                  "居住",
                  "工作",
                  "游憩",
                  "交通",
                  "土地利用"
            ]
      },
      {
            "id": "mumford",
            "title": "芒福德城市有机体与区域主义理论",
            "domain": "city",
            "tradition": "人本主义城市观",
            "source": "来自芒福德对现代城市、区域主义和技术理性的批判，代表作包括 The Culture of Cities、The City in History。",
            "content": [
                  "将城市行为理解为社会生活、文化表达、公共记忆和社区交往的综合过程。",
                  "其分类依据偏向人的生活需要和城市文化功能，而不是单一效率或交通功能。",
                  "可提示行为谱系纳入交往、照护、仪式、社区参与、地方认同等具有社会文化意义的行为类别。"
            ],
            "frameworkRole": "为行为谱系提供人本和地方生活视角，说明公共空间行为不仅是移动或停留，也包括社区交往、文化参与和地方认同等日常生活实践。",
            "extensions": [
                  "人本主义规划",
                  "区域规划理论",
                  "社区生活研究",
                  "步行城市与场所营造"
            ],
            "tags": [
                  "人本",
                  "社区",
                  "文化",
                  "区域",
                  "公共生活"
            ]
      },
      {
            "id": "gehl",
            "title": "盖尔公共生活理论",
            "domain": "city",
            "tradition": "公共生活观察",
            "source": "来自建筑学、城市设计和环境行为研究传统，代表作包括 Life Between Buildings、Cities for People、How to Study Public Life。",
            "content": [
                  "将公共空间活动划分为必要性活动、选择性活动和社会性活动。",
                  "分类依据是活动发生的必要程度及其对空间质量的依赖程度：必要活动较少依赖环境，选择性和社会性活动更依赖空间品质。",
                  "可直接支撑公共空间行为谱系中通行、停留、观看、休闲、交谈、陪伴和互动等行为类型的区分。"
            ],
            "frameworkRole": "为行为谱系提供公共空间行为的中层分类逻辑，可支撑 L2 活动情境和 L3 行为类型的划分，如必要活动、选择性活动和社会性活动。",
            "extensions": [
                  "公共生活研究",
                  "PSPL 调研方法",
                  "活动地图",
                  "人本尺度城市设计"
            ],
            "tags": [
                  "公共生活",
                  "必要活动",
                  "选择活动",
                  "社会活动",
                  "观察"
            ]
      },
      {
            "id": "whyte",
            "title": "怀特街道生活观察理论",
            "domain": "city",
            "tradition": "街道生活观察",
            "source": "来自纽约 Street Life Project，代表作 The Social Life of Small Urban Spaces。",
            "content": [
                  "通过实地观察把公共空间行为识别为坐、站、走、看、交谈、进食、等待、围观和边缘逗留等可见行为。",
                  "分类依据是人在小型公共空间中的实际使用方式，以及座位、阳光、树荫、食物、边缘和可见性等空间诱因。",
                  "可支撑将停留行为进一步细分为坐憩、倚靠、观看、交谈、消费性停留和边缘性停留。"
            ],
            "frameworkRole": "为行为谱系提供微观公共空间使用依据，说明停留、观看、交谈、进食、边缘逗留等具体行为可由空间要素和使用机会解释。",
            "extensions": [
                  "行为制图",
                  "小型公共空间评价",
                  "场所营造",
                  "公共空间管理研究"
            ],
            "tags": [
                  "街道生活",
                  "停留",
                  "座位",
                  "广场",
                  "观察"
            ]
      },
      {
            "id": "jacobs",
            "title": "雅各布斯街道生活理论",
            "domain": "city",
            "tradition": "街道活力",
            "source": "来自对现代主义功能分区和大规模城市更新的批判，代表作 The Death and Life of Great American Cities。",
            "content": [

    ]);

      "icf", "adl", "otpf", "weber", "practice", "timeuse",
      "icatus", "hetus", "activityTheory", "pacs"
    ]);

    function theoryWeight(id) {
      if (coreTheoryIds.has(id)) return "core";
      if (contextTheoryIds.has(id)) return "context";
      return "supplement";
    }

    function relationDegree(id) {
      return relations.reduce((sum, [a, b]) => sum + (a === id || b === id ? 1 : 0), 0);
    }

    function influenceLevel(id) {
      if (id === "framework") return "框架归纳";
      const degree = relationDegree(id);
      if (degree >= 7) return "高影响核心";
      if (degree >= 4) return "关键连接";
      return "外围参照";
    }

    function edgeWeight(a, b, active) {
      const aw = theoryWeight(a);
      const bw = theoryWeight(b);
      const degreeA = relationDegree(a);
      const degreeB = relationDegree(b);
      let width = 0.75;
      if (aw === "core" || bw === "core") width += 0.45;
      if (aw === "core" && bw === "core") width += 0.65;
      if (aw === "context" && bw === "context") width += 0.22;
      width += Math.min(0.95, (degreeA + degreeB) * 0.055);
      if (active) width += 0.85;
      return width.toFixed(2);
    }

    function nodeRadius(item) {
      const weight = theoryWeight(item.id);
      const degree = relationDegree(item.id);
      const base = item.id === "framework" ? 42 : weight === "core" ? 28 : weight === "context" ? 23 : 18;
      const domainBoost = item.domain === "bridge" ? 2 : 0;
      return Math.min(62, base + domainBoost + degree * 2.55);
    }

        return `
          <path class="edge-shadow ${active ? "active" : ""} ${dim ? "dim" : ""}" d="M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" stroke="${lineColor}" style="stroke-width:${glowWidth};${visibility}"></path>
          <path class="edge ${active ? "active" : ""} ${dim ? "dim" : ""}" d="M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" stroke="${lineColor}" style="stroke-width:${width};${visibility}"></path>
        `;
      }).join("");

      const nodeMarkup = theories.slice().sort((a, b) => nodeRadius(a) - nodeRadius(b)).map(item => {
        if (!positions[item.id]) return "";
        const [x, y] = positions[item.id];
        const lines = wrapTitle(item.title, item.id);
        const isActive = item.id === state.activeId;
        const isRelated = related.has(item.id);
        const hidden = !visible.has(item.id);
        const dim = state.activeId && !isRelated;
        const weight = theoryWeight(item.id);
        const r = nodeRadius(item);
        const fill = item.domain === "city" ? "url(#nodeGradientCity)" : item.domain === "behavior" ? "url(#nodeGradientBehavior)" : "url(#nodeGradientBridge)";
        const stroke = domainColor[item.domain];
        const lineGap = item.id === "framework" ? 18 : weight === "core" ? 17 : weight === "context" ? 15 : 13;
        const text = lines.map((line, index) => `<text x="${x}" y="${y + (index - (lines.length - 1) / 2) * lineGap}">${line}</text>`).join("");
        const glow = weight === "core" ? r + 6 : weight === "context" ? r + 4 : r + 3;
        return `
          <g class="node ${weight} ${isActive ? "active" : ""} ${dim ? "dim" : ""}" data-id="${item.id}" data-domain="${item.domain}" ${hidden ? 'style="display:none"' : ""}>
            <circle class="node-glow" cx="${x}" cy="${y}" r="${glow}" fill="${stroke}"></circle>
            <circle class="node-core" cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}"></circle>
            ${text}
          </g>
        `;
      }).join("");

      svg.innerHTML = defs + clusterMarkup + edgeMarkup + timelineMarkup + nodeMarkup;

      svg.querySelectorAll(".node").forEach(node => {
        node.addEventListener("click", () => selectTheory(node.dataset.id));
      });
      svg.querySelectorAll(".timeline-dot").forEach(dot => {
        dot.addEventListener("click", () => selectTheory(dot.dataset.id));
      });
    }

    function selectTheory(id) {
      state.activeId = id;
      renderList();
      renderDetail();
      renderRelations();
      renderGraph();
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll(".segments button").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });
      if (!filteredTheories().some(item => item.id === state.activeId)) {
        const first = filteredTheories()[0] || theories[0];
        state.activeId = first.id;
      }
      renderList();
      renderDetail();
      renderRelations();
      renderGraph();
    }

    document.getElementById("search").addEventListener("input", event => {
      state.query = event.target.value;
      if (!filteredTheories().some(item => item.id === state.activeId)) {
        const first = filteredTheories()[0];
        if (first) state.activeId = first.id;
      }
      renderList();
      renderDetail();
      renderRelations();
      renderGraph();
    });

    document.querySelectorAll(".segments button").forEach(button => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    renderStats();
    renderList();
    renderDetail();
    renderRelations();
    renderGraph();
  </script>
</body>
</html>
